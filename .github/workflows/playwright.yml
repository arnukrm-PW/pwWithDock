name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Select test suite"
        type: choice
        options:
          - test:master
          - test:sanity
          - test:regression
          - test:e2e
          - test:api
          - test:web
          - test:datadriven
        default: "test:sanity"
      browser:
        description: "select browser"
        type: choice
        options:
          - chromium
          - firefox
          - webkit
        default: "chromium"
      mode:
        description: "run mode"
        type: choice
        options:
          - headless
          - headed
        default: "headless"




jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    
    - name: create .env file
      run: Copy-Item .env.example .env

    - name: Run Playwright tests
      run: 
        $suite = "${{github.event.inputs.test_suite || 'test:e2e'}}"
        $browser = "${{github.event.inputs.browser || 'chromium'}}"
        $mode = "${{github.enent.inputs.mode || 'headless'}}"

        $tag = $suite -replace 'test:'
        $browserFlag = "--project=$browser"
        $modeFlag = if ($mode -eq 'headed') { '--headed' } else { ''}


        npx playwright test --grep "@$tag" ; $browserFlag ; $modeFlag --reporter=dot --output=test
      env:
        CI: "1"

    - name: Upload Playwright HTML Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Upload Playwright HTML Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Upload Custom Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30       
